# Curated enterprise catalog.
#   default <kind> allow|deny     (deny => allow-list mode: only listed pass)
#   <kind> <name> allow|deny [version|*]
# kinds: npm pip vsx ai

# NPM: open by default, block known-bad / typosquats, pin a couple.
default npm allow
npm event-stream deny
npm flatmap-stream deny
npm colors deny
npm left-pad allow *
npm typescript allow 5.4.5

# PIP: open by default, block a known malicious name.
default pip allow
pip ctx deny
pip requests allow *

# IDE extensions: allow-list only (deny by default).
default vsx deny
vsx ms-python.python allow
vsx dbaeumer.vscode-eslint allow
vsx rust-lang.rust-analyzer allow

# AI tools: allow-list the sanctioned agents; everything else is Shadow AI.
default ai deny
ai claude allow
ai codex allow
ai gemini allow
ai ollama allow
