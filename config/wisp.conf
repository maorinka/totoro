# wispd configuration
rules   = /etc/wisp/rules.conf
catalog = /etc/wisp/catalog.conf
fim     = /etc/wisp/fim.conf
netpolicy = /etc/wisp/netpolicy.conf
state_dir = /var/lib/wisp
log_dir   = /var/log/wisp

# monitor | enforce. Ships in monitor so nothing is killed until policy is tuned.
mode = monitor

# write every exec to telemetry.jsonl (set 0 on very busy hosts)
telemetry = 1

# full inventory rescan cadence and housekeeping tick (seconds)
inventory_interval = 86400
housekeeping = 60

# Exec-event coalescing window (ms). 0 = process each exec on its own wakeup
# (lowest latency, highest CPU under load). >0 batches a burst into one
# wakeup -> far lower CPU under sustained load, at up to this much added
# detection latency. Safe because the eBPF sensor captures each event in
# the kernel at exec time, so batching never misses a short-lived process.
coalesce_ms = 500

# --- CPU self-governor -------------------------------------------------------
# Hard self-imposed CPU cap, as a percentage of one core. The agent measures
# its own CPU ~once/sec under load and sheds work to stay under this.
cpu_budget = 0.05
# budget_mode (both modes always hold the cpu_budget cap):
#   budget-first   - start shedding early. Under an exec storm the sensor first
#                    stops per-exec telemetry, then has the kernel forward
#                    only a sample of execs of programs proven benign (seen
#                    many times, never alerted). Novel or ever-alerted
#                    programs are always evaluated.
#   security-first - keep full coverage for as long as possible: shed
#                    telemetry first, and sample proven-benign churn only once
#                    actually at the cap.
budget_mode = budget-first

group = default

# Fleet console (leave blank for standalone). host:port
# console = console.example.com:8750
# ca   = /etc/wisp/ca.pem
# cert = /etc/wisp/agent.pem
# key  = /etc/wisp/agent.key
# tpm = 1          # key above is a TPM-resident blob; load the tpm2 OpenSSL
#                  # provider (set TPM2OPENSSL_TCTI in the environment). The
#                  # private key never leaves the TPM. See bench/tpm_identity_demo.sh
# slack_webhook = https://hooks.slack.com/services/...

# Behavior anomalies: after this learning window (seconds), the first execution
# of a program never seen on this host raises ANOM-001. -1 disables.
anomaly_learn = 3600

# Short-lived runner / container: the console decommissions this host as soon
# as the sensor exits instead of letting it go stale.
# ephemeral = 1
