# Wisp policy rules.  First match wins.
#   <id> <severity> <action> <mitre|-> "<title>" [mode=...] <cond>...
# fields: exe cmd comm pcomm actor src uid tty
# ops:    =(equals) ^=(prefix) $=(suffix) *=(contains);  prefix ! to negate
# comma-separated values are OR'ed.  Multiple conditions are AND'ed.

# ---- allow-list: keep the common, benign cases cheap and quiet ----
ALLOW-001 info ignore - "system package manager (apt/dpkg) on tty" comm=apt,apt-get,dpkg,dnf,yum tty=yes

# ---- credential & secret access ----
CRED-001 high alert T1552.001 "Read of SSH private key" cmd*=/.ssh/id_ !comm=ssh,ssh-add,sshd,git
CRED-002 high alert T1555 "Cloud credential file access" cmd*=.aws/credentials,.config/gcloud,.kube/config
CRED-003 critical alert T1003.008 "Shadow/passwd read by non-system actor" cmd*=/etc/shadow actor=ai,code

# ---- reverse shells & remote exec ----
RSHELL-01 critical kill T1059.004 "Shell spawned with network redirection" "cmd*=/dev/tcp/,0<&196"
RSHELL-02 high alert T1059 "Piped download to shell" "cmd*=| sh,| bash,|sh,|bash" "cmd*=curl,wget,fetch"
RSHELL-03 high alert T1071 "Netcat listener / exec" comm=nc,ncat,netcat "cmd*=-e,-c"

# ---- living-off-the-land / discovery ----
LOL-001 medium alert T1059.004 "Base64-decoded piped to shell" "cmd*=base64 -d,base64 --decode,b64decode" "cmd*=| sh,| bash,|sh,|bash"
# Any crontab run except listing: -e, -r, `crontab FILE` and `crontab -` (stdin).
LOL-002 medium alert T1053.003 "Cron entry modified from shell" comm=crontab "!cmd$= -l"
LOL-003 low alert T1087 "Account/host discovery burst" comm=whoami,id,hostname,uname actor=ai

# ---- AI agents & shadow tooling (io.security-style governance) ----
AI-001 medium alert - "AI agent executed a shell" actor=ai comm=sh,bash,zsh
AI-002 high alert T1059 "AI agent ran privileged command" actor=ai "cmd*=sudo ,pkexec,doas "
AI-003 high alert T1071 "AI agent initiated network transfer" actor=ai comm=curl,wget,nc,ncat
AI-004 medium alert - "AI agent touched source control history" actor=ai "cmd*=git push,git reset --hard,git filter-branch"

# ---- package-manager abuse beyond catalog (catalog.c handles curation) ----
PKG-001 high alert T1195.001 "Install with arbitrary pre/post-install script flag" comm=npm,pnpm,yarn cmd*=--unsafe-perm
PKG-002 medium alert T1195 "pip install straight from a URL or VCS" comm=pip,pip3 cmd*=install cmd*=git+,http://,https://

# ---- persistence ----
PERSIST-01 high alert T1543.002 "systemd unit written by non-package actor" cmd*=/etc/systemd/system/ actor=ai,code,human !comm=systemctl,dpkg,apt
PERSIST-02 medium alert T1547.001 "Shell rc file modified" cmd*=/.bashrc,/.zshrc,/.profile actor=ai,code

# ---- privilege escalation ----
PRIV-001 high alert T1548.001 "setuid bit set on a file" comm=chmod cmd*=4755,u+s
PRIV-002 critical alert T1068 "Known exploit helper executed" comm=dirtypipe,pwnkit,exploit
