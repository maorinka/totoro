# Wisp network data-flow policy. First match wins.
#   allow|deny <cidr>|any[:port|:any] [actor=<actor>]
#   limit      <cidr>|any[:port|:any] <N>/s|<N>/m [actor=<actor>]
#     per-process connection-rate limit; non-terminal (later rules still apply);
#     over the limit -> NET-RATE alert, enforce mode stops the process
# Examples:
limit any:443             60/m actor=ai # AI agents: at most 60 new HTTPS connections/min per process
deny  any:9999            actor=ai     # AI agents may not reach a known exfil port
deny  any:2323                          # block Telnet/alt-telnet egress fleet-wide
allow 10.0.0.0/8:any                    # internal network is fine
# deny any:any            actor=ai     # uncomment for default-deny AI-agent egress
