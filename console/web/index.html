<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Wisp Console</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js" defer></script>
</head>
<body>
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 15c3-6 6-6 8 0s5 6 8 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4 9c3-6 6-6 8 0s5 6 8 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".45"/></symbol>
  <symbol id="i-overview" viewBox="0 0 24 24"><path d="M4 13h6V4H4zm10 7h6v-9h-6zM4 20h6v-4H4zm10-11h6V4h-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4m0 3h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-hosts" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 20h8m-4-4v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-bug" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="13" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7V4m-5 7H3m18 0h-4M7 16H3.5m17 0H17M9 4l1.5 2M15 4l-1.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v6c0 4.5 3.2 7.8 7.5 9 4.3-1.2 7.5-4.5 7.5-9V6L12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-rollout" viewBox="0 0 24 24"><path d="M4 18h4V12H4zm6 0h4V8h-4zm6 0h4V4h-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3m0 13v3M2.5 12h3m13 0h3M5.3 5.3l2.1 2.1m9.2 9.2 2.1 2.1m0-13.4-2.1 2.1m-9.2 9.2-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-incident" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m3 12.5 9 5 9-5M3 17l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" opacity=".6"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13 6.5 5h11L20 13v6H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 13h4.5l1.5 2.5h4l1.5-2.5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M18.5 3v3m-1.5-1.5h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor"/></symbol>
  <symbol id="i-sev-critical" viewBox="0 0 16 16"><path d="M8 1.5 14.5 8 8 14.5 1.5 8z" fill="currentColor"/></symbol>
  <symbol id="i-sev-high" viewBox="0 0 16 16"><path d="M8 2 15 14H1z" fill="currentColor"/></symbol>
  <symbol id="i-sev-medium" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5" fill="currentColor"/></symbol>
  <symbol id="i-sev-low" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="currentColor"/></symbol>
  <symbol id="i-sev-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="m3 8.5 3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-ext" viewBox="0 0 16 16"><path d="M9 3h4v4m0-4L7 9M11 10v3H3V5h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<a class="skip" href="#main">Skip to content</a>
<div id="app" class="app" hidden>
  <aside class="side" id="side" aria-label="Primary">
    <div class="brand"><svg class="ic"><use href="#i-logo"/></svg><span>Wisp</span><small id="ver"></small></div>
    <nav>
      <a href="/" data-route="overview"><svg class="ic"><use href="#i-overview"/></svg>Overview</a>
      <a href="/incidents" data-route="incidents"><svg class="ic"><use href="#i-incident"/></svg>Incidents</a>
      <a href="/suggestions" data-route="suggestions"><svg class="ic"><use href="#i-inbox"/></svg>Suggestions<span class="count" id="nav-suggestions" hidden></span></a>
      <a href="/analysis" data-route="analysis"><svg class="ic"><use href="#i-spark"/></svg>Analysis</a>
      <a href="/alerts" data-route="alerts"><svg class="ic"><use href="#i-alert"/></svg>Alerts<span class="count" id="nav-alerts" hidden></span></a>
      <a href="/hosts" data-route="hosts"><svg class="ic"><use href="#i-hosts"/></svg>Hosts</a>
      <a href="/investigate" data-route="investigate"><svg class="ic"><use href="#i-search"/></svg>Investigate</a>
      <a href="/vulnerabilities" data-route="vulnerabilities"><svg class="ic"><use href="#i-bug"/></svg>Vulnerabilities</a>
      <a href="/posture" data-route="posture"><svg class="ic"><use href="#i-shield"/></svg>Posture</a>
      <a href="/rollouts" data-route="rollouts"><svg class="ic"><use href="#i-rollout"/></svg>Rollouts</a>
      <a href="/settings" data-route="settings"><svg class="ic"><use href="#i-settings"/></svg>Settings</a>
    </nav>
    <div class="side-foot"><span class="who" id="who"></span></div>
  </aside>
  <div class="mainwrap">
    <header class="top">
      <button class="iconbtn only-narrow" id="menu" aria-label="Open navigation" aria-expanded="false" aria-controls="side"><svg class="ic"><use href="#i-menu"/></svg></button>
      <h1 id="title">Overview</h1>
      <div class="top-right">
        <span class="live" id="live" role="status" aria-live="polite"></span>
        <button class="iconbtn" id="pause" aria-label="Pause auto-refresh" title="Pause auto-refresh"><svg class="ic"><use href="#i-pause"/></svg></button>
        <button class="iconbtn" id="theme" aria-label="Toggle colour theme" title="Toggle colour theme"><svg class="ic"><use href="#i-moon"/></svg></button>
      </div>
    </header>
    <div class="banner" id="banner" role="alert" hidden></div>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<div id="signin" class="signin" hidden>
  <form class="signin-card" id="signin-form">
    <div class="brand big"><svg class="ic"><use href="#i-logo"/></svg><span>Wisp Console</span></div>
    <p class="muted">Sign in with an API token issued by your Wisp administrator.</p>
    <label for="token">API token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" spellcheck="false" required placeholder="wisp_…">
    <label class="check"><input type="checkbox" id="remember"> Keep me signed in on this device</label>
    <p class="err" id="signin-err" role="alert" hidden></p>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="fine muted">Administrators create tokens with <code>wisp-console -gen-token &lt;role&gt;:&lt;name&gt;</code>.</p>
  </form>
</div>

<div id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-panel">
    <header><h2 id="drawer-title"></h2><button class="iconbtn" id="drawer-close" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button></header>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>

<div id="confirm" class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body" hidden>
  <div class="modal-card">
    <h2 id="confirm-title"></h2>
    <div id="confirm-body"></div>
    <div class="row end"><button class="btn" id="confirm-no">Cancel</button><button class="btn primary" id="confirm-yes">Confirm</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
</body>
</html>
